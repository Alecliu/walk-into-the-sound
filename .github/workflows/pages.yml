name: Publish Walk into the sound
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: walk-into-the-sound-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared website and source
        if: hashFiles('site-bootstrap.tar.gz') != ''
        run: |
          tar -xzf site-bootstrap.tar.gz
          rm site-bootstrap.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import verified story website and source'
          git push
      - name: Verify published snapshot
        run: python3 scripts/verify-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
